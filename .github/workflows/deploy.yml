name: 构建并部署到 GitHub Pages

# 触发条件：推送到 main，或手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；不取消进行中的部署，避免发布到一半被中断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: 构建站点
        run: npm run build

      - name: 安全校验 —— 确认内部目录没有被带进产物
        run: |
          if [ -e _site/.workbuddy ]; then
            echo "::error::产物中出现 .workbuddy 目录，已中止部署"
            exit 1
          fi
          if [ ! -f _site/index.html ]; then
            echo "::error::产物缺少 index.html，构建异常"
            exit 1
          fi
          if [ ! -f _site/CNAME ]; then
            echo "::error::产物缺少 CNAME，自定义域名会失效"
            exit 1
          fi
          echo "产物文件数：$(find _site -type f | wc -l)"

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
