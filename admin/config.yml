# =============================================================================
# Sveltia CMS 配置
# 文档: https://sveltiacms.app/zh/docs/
#
# 登录方式：访问令牌（token）
#   不需要 OAuth 应用、不需要中转服务。首次登录时点「Sign In with Token」，
#   按提示在 GitHub 生成一个细粒度令牌并粘贴即可。
#   令牌存在浏览器本地，所以不要在公司/公共电脑上登录。
# =============================================================================

backend:
  name: github
  repo: qgle88-prog/qgle88-prog.github.io
  branch: main
  # 只允许令牌登录，关掉 OAuth（我们没部署中转服务）
  auth_methods: [token]
  commit_messages:
    create: '内容：新增 {{collection}} 「{{slug}}」'
    update: '内容：更新 {{collection}} 「{{slug}}」'
    delete: '内容：删除 {{collection}} 「{{slug}}」'
    uploadMedia: '内容：上传图片「{{path}}」'
    deleteMedia: '内容：删除图片「{{path}}」'

# 界面语言
locale: zh-Hans

# 图片上传到哪里
media_folder: assets/uploads
public_folder: /assets/uploads

# 编辑器里同时显示预览
show_preview_links: true

collections:
  # ---------------------------------------------------------------- 文章 ----
  - name: articles
    label: 文章
    label_singular: 文章
    description: 长文、笔记、教程。发布后会出现在「文章」列表页和首页的「笔记」区。
    folder: content/articles
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    preview_path: "articles/{{fields.slug}}/"
    sortable_fields: [date, title]
    fields:
      - label: 标题
        name: title
        widget: string
        hint: 中文可以，会显示在列表和浏览器标签上
      - label: 链接标识
        name: slug
        widget: string
        required: true
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只能用小写字母、数字和连字符，例如 llm-weekly-report']
        hint: 英文短标识，决定网址。改这个会改变已有链接
      - label: 发布日期
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
      - label: 摘要
        name: summary
        widget: text
        required: false
        hint: 一两句话。会显示在列表页、首页和搜索结果里
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        required: false
        hint: 打开后不会发布到线上，方便先写着
      - label: 正文
        name: body
        widget: markdown

  # ---------------------------------------------------------------- 作品 ----
  - name: works
    label: 作品
    label_singular: 作品
    description: 你做的工具、项目、脚本。发布后会出现在「作品」页和首页。
    folder: content/works
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    preview_path: "works/{{fields.slug}}/"
    sortable_fields: [date, title]
    fields:
      - label: 名称
        name: title
        widget: string
      - label: 链接标识
        name: slug
        widget: string
        required: true
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只能用小写字母、数字和连字符']
        hint: 英文短标识，决定网址
      - label: 日期
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
      - label: 状态
        name: status
        widget: select
        options:
          - 使用中
          - 实验中
          - 开源
          - 归档
        default: 使用中
      - label: 技术栈
        name: stack
        widget: list
        required: false
        default: []
        hint: 例如 Python、pandas、Ollama
      - label: 一句话说明
        name: summary
        widget: text
        hint: 显示在卡片上，建议控制在 60 字以内
      - label: 图标
        name: icon
        widget: select
        options:
          - { label: 序列 / 生物, value: bio }
          - { label: 图表 / 数据, value: chart }
          - { label: 搜索 / 检索, value: search }
          - { label: 模型 / AI, value: ai }
          - { label: 文档, value: doc }
          - { label: 代码, value: code }
        default: code
      - label: 项目链接
        name: link
        widget: string
        required: false
        hint: 可选。填 GitHub 仓库地址或演示地址
      - label: 详细介绍
        name: body
        widget: markdown
        required: false

  # ---------------------------------------------------------------- 动态 ----
  - name: notes
    label: 动态
    label_singular: 动态
    description: 短更新，类似说说。适合记录进展、随手记、一句话想法。
    folder: content/notes
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    preview_path: "notes/{{fields.slug}}/"
    sortable_fields: [date, title]
    fields:
      - label: 日期
        name: date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
      - label: 标识
        name: slug
        widget: string
        required: true
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只能用小写字母、数字和连字符']
        hint: 英文短标识，决定网址
      - label: 标题
        name: title
        widget: string
        required: false
        hint: 可选。动态通常不需要标题
      - label: 内容
        name: body
        widget: markdown
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 配图
        name: image
        widget: image
        required: false
